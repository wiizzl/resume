cv:
  name: Pierre Houllière
  headline: Recherche d'Alternance -- Développeur Full Stack -- de 1 à 3 ans
  location: Rouen
  email: contact@houlliere.com
  phone: +33-6-11-77-62-00
  photo: assets/me.jpg

  social_networks:
    - network: LinkedIn
      username: pierrehoulliere
    - network: GitHub
      username: wiizzl

  custom_connections:
    - fontawesome_icon: cake
      placeholder: 20 ans
      url:

  sections:
    expériences:
      - company: "[Freelance](https://houlliere.com)"
        position: Développeur Full-Stack
        start_date: 2024-11
        end_date: 2026-08
        location: À distance
        summary: Gestion de projets de bout en bout pour divers clients en tant qu'entrepreneur individuel.
        technologies: React, TailwindCSS, Golang, Docker, Astro, AWS
        highlights:
          - "PF Rivière : Conception et développement d'un CMS pour site vitrine avec analytics poussés via AWS."
          - "Folding Art / Laine & Maille : Développement et maintenance de 2 sites e-commerce comptant 250+ utilisateurs. Déploiement automatisé via CI/CD."
          - "Overspeed : Finalisation et déploiement du projet réalisé en stage de BTS."

      - company: "[Matmut](https://matmut.fr/groupe-matmut/qui-sommes-nous.html)"
        position: Développeur Web
        start_date: 2026-01
        end_date: 2026-02
        location: Rouen
        summary: Stage de deuxième année de BTS.
        technologies: React (TanStack Start), Playwright, Azure DevOps
        highlights:
          - Mise en place des tests de régression visuelle pour le design system (100+ composants).
          - Développement d'un dashboard de performance (poids, temps de chargement) des assets du design system, utilisé quotidiennement par l'équipe UX.

      - company: "[Overspeed](https://linkedin.com/company/overspeed)"
        position: Développeur Full-Stack
        start_date: 2025-05
        end_date: 2025-06
        location: Rouen
        summary: Stage de première année de BTS puis repris en tant que prestataire.
        technologies: React (Next.js), Golang (Gin), Docker
        highlights:
          - Conception d'un CMS multi-client utilisé par 20+ entreprises clientes.
          - Amélioration du SEO en passant d'une SPA à du SSR.

      - company: "[WorldSkills France](https://worldskills-france.org)"
        position: Compétiteur puis Bénévole
        start_date: 2024-11
        summary: Plus grande compétition des métiers au monde. Je suis impliqué dans la catégorie Développement Web.
        highlights:
          - Vice-champion de France (Marseille 2025) & Champion régional Normandie (Caen 2024).
          - Expert national adjoint depuis mars 2026 pour l'édition Orléans 2027.

    compétences:
      - label: Langages
        details: TypeScript/JavaScript, Golang, C# (.NET), Java, Python, PHP, SQL, HTML/CSS

      - label: Technologies Web
        details: React, Next.js, Écosystème TanStack, Angular, TailwindCSS, Node.js, Bun, React Native, Tauri

      - label: Systèmes & DevOps
        details: GNU/Linux, CI/CD (GitHub Actions, GitLab CI/CD), Docker, Kubernetes, GitOps (ArgoCD)

      - label: Bases de données
        details: PostgreSQL, MySQL/MariaDB, SQL Server, Redis, MongoDB

      - label: Modélisation & Conception
        details: UML, Merise, Agile Scrum, Clean Code, Design Patterns

      - label: Soft Skills
        details: Communication, Travail en équipe, Résolution de problèmes, Adaptabilité

    projets:
      - name: "[Fulgur](https://wiizzl.github.io/fulgur)"
        date: 2026-07
        summary: Framework sur mesure créé pour faciliter le développement d'applications fullstack.
        technologies: Bun, Vite, Elysia

      - name: "[CV dynamique](https://github.com/wiizzl/resume)"
        date: 2025-09
        summary: "Génération automatisée de ce CV : mise à jour et déploiement en 1 commit via CI/CD."
        technologies: Python, GitHub Actions

      - name: "[B-Pump](https://github.com/B-Pump/bpump-app)"
        start_date: 2024-01
        end_date: 2024-05
        summary: Application mobile de pilotage d'un robot d'analyse de mouvement par IA, projet d'équipe.
        technologies: React Native (Expo), Socket.IO, Mediapipe

    formations:
      - institution: "[CESI](https://cesi.fr/formation/ingenieur-e-informatique-cursus-en-3-ans-par-lapprentissage-2513617)"
        degree: Diplôme d'Ingénieur
        area: Informatique
        start_date: 2026
        end_date: 2029
        location: Rouen
        summary: Formation en alternance avec un rythme de 1 mois en école pour 1 mois en entreprise.

      - institution: "[Campus La Châtaigneraie](https://la-chataigneraie.org/bts-service-informatiques-organisations-solutions-logicielles-applications-metiers)"
        degree: BTS SIO
        area: Solutions Logicielles et Applications Métiers
        start_date: 2024
        end_date: 2026
        location: Le Mesnil-Esnard
        summary: Option mathématiques approfondies.

    langues_/_loisirs:
      - label: Anglais
        details: "[C1](https://cert.efset.org/fr/BwATyb)"
      - label: Allemand
        details: A2
      - label: Sport
        details: Musculation, Volleyball

design:
  theme: opal

  page:
    size: a4
    top_margin: 0.3in
    bottom_margin: 0.3in
    left_margin: 0.3in
    right_margin: 0.3in
    show_footer: false
    show_top_note: false

  colors:
    body: rgb(0, 0, 0)
    name: rgb(135, 60, 20)
    headline: rgb(105, 45, 15)
    connections: rgb(105, 45, 15)
    section_titles: rgb(135, 60, 20)
    links: rgb(135, 60, 20)
    footer: rgb(165, 110, 80)
    top_note: rgb(165, 110, 80)

  typography:
    line_spacing: 0.55em
    alignment: left
    date_and_location_column_alignment: right
    font_family:
      body: Lato
      name: Lato
      headline: Lato
      connections: Lato
      section_titles: Lato
    font_size:
      body: 10pt
      name: 18pt
      headline: 12pt
      connections: 10pt
      section_titles: 12pt
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: false
      headline: true
      connections: false
      section_titles: true

  links:
    underline: false
    show_external_link_icon: true

  header:
    alignment: left
    photo_width: 2cm
    photo_position: right
    photo_space_left: 0.4cm
    photo_space_right: 0cm
    space_below_name: 0.2cm
    space_below_headline: 0.4cm
    space_below_connections: 0.4cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ·
      space_between_connections: 0.6cm

  section_titles:
    type: with_partial_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm

  sections:
    allow_page_break: true
    space_between_regular_entries: 0.8em
    space_between_text_based_entries: 0.25em
    show_time_spans_in: []

  entries:
    date_and_location_width: 3cm
    side_space: 0.1cm
    space_between_columns: 0cm
    allow_page_break: false
    short_second_row: true
    degree_width: 1cm
    summary:
      space_above: 0.04cm
      space_left: 0cm
    highlights:
      bullet: ◦
      nested_bullet: ◦
      space_left: 0.15cm
      space_above: 0.04cm
      space_between_items: 0.04cm
      space_between_bullet_and_text: 0.5em

  templates:
    footer: "*NAME -- PAGE_NUMBER/TOTAL_PAGES*"
    top_note: "*LAST_UPDATED MONTH_NAME YEAR*"
    single_date: MONTH_ABBREVIATION YEAR_IN_TWO_DIGITS
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: "LABEL : *DETAILS*"
    education_entry:
      main_column: |-
        INSTITUTION -- DEGREE (AREA)
        *SUMMARY*
        HIGHLIGHTS
      degree_column:
      date_and_location_column: |-
        LOCATION
        DATE
    normal_entry:
      main_column: |-
        NAME -- *TECHNOLOGIES*
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        COMPANY -- POSITION
        *TECHNOLOGIES*
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE

locale:
  language: french
  last_updated: Mis à jour en
  month: mois
  months: mois
  year: an
  years: ans
  present: Présent
  month_abbreviations:
    - Jan
    - Fév
    - Mar
    - Avr
    - Mai
    - Juin
    - Juil
    - Août
    - Sep
    - Oct
    - Nov
    - Déc
  month_names:
    - Janvier
    - Février
    - Mars
    - Avril
    - Mai
    - Juin
    - Juillet
    - Août
    - Septembre
    - Octobre
    - Novembre
    - Décembre

settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    design:
    locale:
    typst_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.typ
    pdf_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.pdf
    markdown_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.md
    html_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.html
    png_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.png
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: true
  bold_keywords: []
  pdf_title: CV - NAME
